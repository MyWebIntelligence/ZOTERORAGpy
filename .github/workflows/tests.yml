# Intégration continue (audit A13, 2026-09-27) : Python 3.11 comme l'image Docker,
# aucun secret, suite hors ligne (proxy mort) et contrôles statiques minimaux.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      - name: Dépendances, modèle spaCy et cache tiktoken (seule étape avec réseau)
        env:
          TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/data/tiktoken_cache
        run: python -m pip install -r scripts/requirements-dev.txt && python -m spacy download fr_core_news_md && python -c "import tiktoken; tiktoken.encoding_for_model('text-embedding-3-large'); tiktoken.get_encoding('o200k_base')"

      - name: Syntaxe
        run: python -m compileall -q app scripts core ingestion tests conftest.py

      - name: Lint (erreurs seulement, ruff.toml)
        run: ruff check .

      - name: Tests hors ligne
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,testserver
          TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/data/tiktoken_cache
        run: python -m pytest tests/ scripts/test_rad_vectordb.py scripts/test_rad_chunk_initial_phase.py scripts/test_albert_guard_scope.py app/test_main.py -q -p no:cacheprovider
