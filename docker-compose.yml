# RAGpy - Docker Compose Configuration
# Usage: docker compose up -d

services:
  ragpy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # OCR local (Docling) — mettre INSTALL_LOCAL_OCR=true dans .env pour
        # installer les deps lourdes, puis `docker compose up -d --build`.
        INSTALL_LOCAL_OCR: "${INSTALL_LOCAL_OCR:-false}"
        # Audio Albert (sprint R2) : ffmpeg pour convertir et découper les enregistrements.
        INSTALL_FFMPEG: "${INSTALL_FFMPEG:-false}"
    container_name: ragpy
    restart: unless-stopped
    # Limites ressources pour stabilité (P1-T2)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8000:8000"
    volumes:
      # Persistance des données
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      # Sources pour traitement (optionnel)
      - ./sources:/app/sources
      # .env monté (lecture-écriture) plutôt que passé en env_file : l'application
      # le relit quand il change (page Paramètres comprise) ; un env_file figerait
      # ses valeurs dans l'environnement du conteneur (sprint « configuration unifiée »).
      # Le fichier doit exister sur l'hôte avant docker compose up.
      - ./.env:/app/.env
    environment:
      - APP_URL=${APP_URL:-http://localhost:8000}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      # Même broker que le worker (réseau interne) : soumissions Celery et limiteur Albert
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Limiteur Albert partagé entre processus et conteneurs (audit A12) ; repli local si Redis tombe
      - ALBERT_LIMITER_BACKEND=${ALBERT_LIMITER_BACKEND:-redis}
      # Lus par la commande de démarrage de l'image (avant Python) : transmis ici.
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      - UVICORN_TIMEOUT_KEEP_ALIVE=${UVICORN_TIMEOUT_KEEP_ALIVE:-120}
      - UVICORN_LIMIT_CONCURRENCY=${UVICORN_LIMIT_CONCURRENCY:-100}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/detailed"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Prometheus monitoring (optionnel - décommenter si besoin)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: ragpy-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--storage.tsdb.retention.time=30d'
  #     - '--web.enable-lifecycle'
  #   depends_on:
  #     - ragpy

  # Grafana dashboard (optionnel - décommenter avec prometheus)
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: ragpy-grafana
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   depends_on:
  #     - prometheus

  # Service Qdrant local (optionnel - décommenter si besoin)
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: ragpy-qdrant
  #   restart: unless-stopped
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   environment:
  #     - QDRANT__SERVICE__GRPC_PORT=6334

  # ==========================================================================
  # CELERY QUEUE SYSTEM (Phase 3 - Production Architecture)
  # ==========================================================================

  redis:
    image: redis:7-alpine
    container_name: ragpy-redis
    restart: unless-stopped
    # Sans authentification : publié sur l'hôte en local seulement (audit A09).
    # Les conteneurs passent par le réseau interne (redis://redis:6379).
    # REDIS_BIND=0.0.0.0 ne doit servir qu'avec un pare-feu et un mot de passe.
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LOCAL_OCR: "${INSTALL_LOCAL_OCR:-false}"
        INSTALL_FFMPEG: "${INSTALL_FFMPEG:-false}"
    container_name: ragpy-celery-worker
    restart: unless-stopped
    # Sans -Q : le worker consomme toutes les files de CELERY_QUEUES
    # (task_queues de app/celery_app.py, audit A04).
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./sources:/app/sources
      # .env monté (lecture-écriture) plutôt que passé en env_file : l'application
      # le relit quand il change (page Paramètres comprise) ; un env_file figerait
      # ses valeurs dans l'environnement du conteneur (sprint « configuration unifiée »).
      # Le fichier doit exister sur l'hôte avant docker compose up.
      - ./.env:/app/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALBERT_LIMITER_BACKEND=${ALBERT_LIMITER_BACKEND:-redis}
    depends_on:
      redis:
        condition: service_healthy
    # L'image hérite du HEALTHCHECK web (curl :8000/health), que ce service
    # n'ouvre pas : contrôle de santé propre, sinon « unhealthy » permanent.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragpy-celery-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # .env monté (lecture-écriture) plutôt que passé en env_file : l'application
      # le relit quand il change (page Paramètres comprise) ; un env_file figerait
      # ses valeurs dans l'environnement du conteneur (sprint « configuration unifiée »).
      # Le fichier doit exister sur l'hôte avant docker compose up.
      - ./.env:/app/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    # L'image hérite du HEALTHCHECK web (curl :8000/health), que beat n'ouvre
    # pas ; beat n'expose aucune sonde : contrôle désactivé (le redémarrage
    # reste assuré par restart: unless-stopped).
    healthcheck:
      disable: true

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragpy-flower
    restart: unless-stopped
    # Identifiants obligatoires (audit A09) : sans FLOWER_USER et FLOWER_PASSWORD
    # (ou avec admin/admin, admin/changeme), Flower refuse de démarrer.
    # Publié en local seulement (tunnel SSH ou proxy TLS) ; FLOWER_BIND pour exposer.
    command: >-
      sh -c 'if [ -z "$$FLOWER_USER" ] || [ -z "$$FLOWER_PASSWORD" ] || [ "$$FLOWER_PASSWORD" = "admin" ] || [ "$$FLOWER_PASSWORD" = "changeme" ]; then echo "Flower : definir FLOWER_USER et FLOWER_PASSWORD (non par defaut) dans .env" >&2; exit 1; fi; exec celery -A app.celery_app flower --port=5555 --basic_auth="$$FLOWER_USER:$$FLOWER_PASSWORD"'
    ports:
      - "${FLOWER_BIND:-127.0.0.1}:5555:5555"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    # L'image hérite du HEALTHCHECK web (curl :8000/health), que ce service
    # n'ouvre pas : contrôle de santé propre, sinon « unhealthy » permanent.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5555/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
